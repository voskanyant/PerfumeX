<form method="post"
      action="{% url 'assistant_linking:normalization_reparse' product.pk %}">
    {% csrf_token %}
    <button class="button ghost"
            type="submit"
            data-confirm="Reparse this supplier row?">Reparse</button>
</form>
<form method="post"
      action="{% url 'assistant_linking:normalization_reparse' product.pk %}">
    {% csrf_token %}
    <input type="hidden" name="force" value="1">
    <button class="button ghost"
            type="submit"
            data-confirm="Force reparse this supplier row and overwrite parser output?">Force reparse</button>
</form>
<form method="post"
      action="{% url 'assistant_linking:normalization_lock' product.pk %}">
    {% csrf_token %}
    <button class="button ghost" type="submit">Lock parse</button>
</form>
<a class="button primary"
   href="{% url 'assistant_linking:product_workbench' product.pk %}">Open linking workbench</a>
