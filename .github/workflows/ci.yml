name: CI and Deploy

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  DATABASE_ENGINE: postgres
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  POSTGRES_DB: perfumex_ci
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  SECRET_KEY: ci-only-not-secret-8f6a90e4d2b64782a4d4c3b2452dd6d7f7e83bb164f24c86
  FERNET_KEYS: ci-only-fernet-key-8f6a90e4d2b64782a4d4c3b2452dd6d7
  DEBUG: "0"
  ALLOWED_HOSTS: 127.0.0.1,localhost
  CSRF_TRUSTED_ORIGINS: https://127.0.0.1,https://localhost
  ASSISTANT_USE_OPENAI: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: npm install
      - run: ruff check .
      - run: npx eslint prices/static/prices/js

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: perfumex_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --plan

  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "1"
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: perfumex_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python manage.py test --parallel=4 --verbosity=1 --noinput

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pip-audit --strict -r requirements.txt
      - run: python manage.py check --deploy
      - run: bandit -r prices assistant_core assistant_linking catalog --severity-level high --exclude "*/tests.py,*/tests/*"

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, migrations, test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          debug: true
          command_timeout: 30m
          script: |
            set -e
            echo "User: $(whoami)"
            echo "Host: $(hostname)"
            cd /opt/perfumex/PerfumeX
            pwd
            OLD_SHA="$(git rev-parse HEAD)"
            git pull --ff-only origin main
            NEW_SHA="$(git rev-parse HEAD)"
            CHANGED_FILES="$(git diff --name-only "$OLD_SHA" "$NEW_SHA" || true)"
            echo "Deploying $OLD_SHA -> $NEW_SHA"

            REQ_HASH="$(sha256sum requirements.txt | awk '{print $1}')"
            REQ_STAMP="/opt/perfumex/PerfumeX/.venv/.requirements.sha256"
            if [ "${FORCE_PIP_INSTALL:-0}" = "1" ] || [ ! -f "$REQ_STAMP" ] || [ "$(cat "$REQ_STAMP")" != "$REQ_HASH" ]; then
              echo "Installing Python requirements"
              /opt/perfumex/PerfumeX/.venv/bin/pip install -r requirements.txt
              printf '%s\n' "$REQ_HASH" > "$REQ_STAMP"
            else
              echo "requirements.txt unchanged; skipping pip install"
            fi

            if ! command -v redis-server >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y redis-server
            fi
            if systemctl is-active --quiet redis-server 2>/dev/null || systemctl is-active --quiet redis 2>/dev/null; then
              echo "Redis is already active"
            elif systemctl list-unit-files redis-server.service >/dev/null 2>&1; then
              systemctl enable --now redis-server
            elif systemctl list-unit-files redis.service >/dev/null 2>&1; then
              systemctl enable --now redis
            else
              echo "Redis service unit was not found after install"
              exit 1
            fi
            while IFS='=' read -r key value || [ -n "$key" ]; do
              key="${key%%[[:space:]]*}"
              case "$key" in
                ''|\#*) continue ;;
              esac
              case "$key" in
                [A-Za-z_][A-Za-z0-9_]*)
                  value="$(printf '%s' "$value" | tr -d '\r' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
                  export "$key=$value"
                  ;;
              esac
            done < /opt/perfumex/PerfumeX/.env
            if [ -z "${FERNET_KEYS:-}" ] && [ -z "${SALT_KEY:-}" ]; then
              if [ -z "${SECRET_KEY:-}" ]; then
                echo "SECRET_KEY is required before deriving FERNET_KEYS"
                exit 1
              fi
              umask 077
              FERNET_KEYS="$(printf '%s' "$SECRET_KEY" | sha256sum | awk '{print $1}')"
              printf '\nFERNET_KEYS=%s\n' "$FERNET_KEYS" >> /opt/perfumex/PerfumeX/.env
              export FERNET_KEYS
            elif [ -z "${FERNET_KEYS:-}" ]; then
              export FERNET_KEYS="$SALT_KEY"
            fi
            /opt/perfumex/PerfumeX/.venv/bin/python manage.py migrate

            if [ -n "${DEPLOY_REPARSE_TERMS:-}" ]; then
              printf '%s' "$DEPLOY_REPARSE_TERMS" | tr '|' '\n' | while IFS= read -r term; do
                [ -z "$term" ] && continue
                /opt/perfumex/PerfumeX/.venv/bin/python manage.py reparse_supplier_products --only-stale --name-contains "$term"
              done
            else
              echo "No DEPLOY_REPARSE_TERMS configured; skipping reparses"
            fi

            if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(assistant_linking/|assistant_core/migrations/|catalog/migrations/)'; then
              /opt/perfumex/PerfumeX/.venv/bin/python manage.py refresh_normalization_stats --all-user-scopes
            else
              echo "No normalization-affecting files changed; skipping normalization stats refresh"
            fi

            if [ ! -f /opt/perfumex/PerfumeX/staticfiles/staticfiles.json ] || printf '%s\n' "$CHANGED_FILES" | grep -Eq '(^|/)static/|[.](css|js)$'; then
              /opt/perfumex/PerfumeX/.venv/bin/python manage.py collectstatic --noinput
            else
              echo "No static asset changes; skipping collectstatic"
            fi
            systemctl restart perfumex
            echo "Application restarted; nginx reload not required for app-only deploy"
