{% if messages %}
    <div class="flash-stack">
        {% for message in messages %}
            <div class="flash flash--{{ message.tags|default:'info' }}">
                <span class="flash-body">{{ message }}</span>
                <button type="button" class="flash-close" aria-label="Dismiss">&times;</button>
            </div>
        {% endfor %}
    </div>
{% endif %}
